<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - BCET Study Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
    <div class="landing-card">
        <h1>BCET Study Portal</h1>
        <p>Welcome! Please select your role to continue.</p>
        <div class="landing-buttons">
            <a href="student.html" class="btn btn-student">
                <i class="fas fa-user-graduate"></i> Continue as Student
            </a>
            <button onclick="attemptAdminLogin()" class="btn btn-admin" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 0.5rem; border: 2px solid var(--border-color); background: transparent; color: var(--text-main); padding: 1rem; font-size: 1.1rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;">
                <i class="fas fa-user-shield"></i> Admin Login
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
